<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云上禅寺 · 3D 多人在线打坐</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a2440;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;user-select:none;}
  canvas{display:block;touch-action:none;}
  /* ---------- 入寺界面 ---------- */
  #enterScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;
    background:radial-gradient(ellipse at 50% 42%, rgba(20,28,52,0.30), rgba(8,12,26,0.82));
    backdrop-filter:blur(3px);}
  .enter-card{width:410px;padding:44px 42px 34px;position:relative;text-align:center;
    background:linear-gradient(160deg,#f7f2e8,#eee2cc);border:1px solid #d8c9a8;border-radius:14px;
    box-shadow:0 18px 60px rgba(0,0,0,0.55);}
  .seal{position:absolute;right:16px;top:14px;width:44px;height:44px;border:2px solid #b3261e;border-radius:6px;
    color:#b3261e;font-size:14px;line-height:19px;display:flex;align-items:center;justify-content:center;
    font-family:"KaiTi","STKaiti",serif;transform:rotate(8deg);opacity:.85;}
  .enter-title{font-family:"KaiTi","STKaiti","SimSun",serif;font-size:46px;letter-spacing:12px;
    color:#2a2237;margin-bottom:6px;text-indent:12px;}
  .enter-sub{font-family:"KaiTi",serif;font-size:15px;letter-spacing:5px;color:#8a6d3b;margin-bottom:28px;}
  #nameInput{width:100%;box-sizing:border-box;padding:13px 16px;font-size:17px;text-align:center;letter-spacing:2px;
    border:1.5px solid #b9a26a;border-radius:8px;background:#fffdf6;color:#2a2237;outline:none;}
  #nameInput:focus{border-color:#b3261e;box-shadow:0 0 0 3px rgba(179,38,30,0.12);}
  #enterBtn{margin-top:18px;width:100%;padding:13px;font-size:19px;letter-spacing:14px;text-indent:14px;
    font-family:"KaiTi",serif;color:#fff;background:linear-gradient(180deg,#a52a1e,#8f1f16);
    border:none;border-radius:8px;cursor:pointer;box-shadow:0 6px 18px rgba(143,31,22,0.35);}
  #enterBtn:hover{filter:brightness(1.08);}
  #enterTip{margin-top:13px;min-height:20px;font-size:13px;color:#a33327;letter-spacing:1px;}
  .enter-foot{margin-top:16px;font-size:12px;color:#9c8a68;letter-spacing:1px;line-height:1.8;}
  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:50;display:none;}
  #topLeft{position:absolute;left:16px;top:14px;display:flex;flex-direction:column;gap:6px;}
  .stat{background:rgba(12,16,30,0.55);border:1px solid rgba(214,178,96,0.35);color:#f0e2b8;
    padding:6px 12px;border-radius:8px;font-size:13px;letter-spacing:1px;backdrop-filter:blur(4px);width:fit-content;}
  .stat b{color:#ffd977;font-size:15px;margin-left:4px;}
  #topRight{position:absolute;right:16px;top:14px;pointer-events:auto;}
  #muteBtn{background:rgba(12,16,30,0.55);border:1px solid rgba(214,178,96,0.35);color:#f0e2b8;
    padding:7px 13px;border-radius:8px;font-size:12px;cursor:pointer;letter-spacing:1px;}
  #hintBar{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);display:none;
    gap:10px;pointer-events:auto;backdrop-filter:blur(4px);}
  #hintBar .htext{background:rgba(12,16,30,0.62);border:1px solid rgba(214,178,96,0.4);color:#ffe9b0;
    padding:9px 22px;border-radius:10px;font-size:14px;letter-spacing:1px;white-space:nowrap;}
  .hbtn{background:rgba(12,16,30,0.62);border:1px solid rgba(214,178,96,0.55);color:#ffd977;
    padding:9px 20px;border-radius:10px;font-size:14px;letter-spacing:2px;white-space:nowrap;cursor:pointer;
    font-family:"Microsoft YaHei",sans-serif;transition:filter .15s,transform .1s;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;}
  .hbtn:hover{filter:brightness(1.25);border-color:rgba(255,217,119,0.9);}
  .hbtn:active{filter:brightness(0.9);transform:scale(0.96);background:rgba(214,178,96,0.35);color:#fff;}
  #chatLog{position:absolute;left:16px;bottom:118px;width:350px;max-height:168px;overflow-y:auto;
    display:flex;flex-direction:column;gap:3px;scrollbar-width:none;}
  #chatLog::-webkit-scrollbar{display:none;}
  .chat-line{background:rgba(12,16,30,0.45);color:#e8e0c8;font-size:12.5px;padding:4px 10px;
    border-radius:6px;width:fit-content;max-width:96%;opacity:.92;}
  .chat-line.sys{color:#9db3d8;font-style:italic;}
  #chatInputWrap{position:absolute;left:16px;bottom:78px;width:350px;pointer-events:auto;display:none;}
  #chatInput{width:100%;box-sizing:border-box;padding:9px 66px 9px 12px;font-size:13px;border-radius:8px;
    border:1px solid rgba(214,178,96,0.45);background:rgba(12,16,30,0.72);color:#fff;outline:none;}
  #chatSend{display:flex;position:absolute;right:3px;top:3px;bottom:3px;width:56px;border:none;border-radius:6px;
    background:linear-gradient(180deg,#d6b260,#bf9944);color:#241c10;font-size:13px;letter-spacing:2px;
    font-family:"Microsoft YaHei",sans-serif;cursor:pointer;align-items:center;justify-content:center;}
  #chatSend:hover{filter:brightness(1.08);}
  #chatSend:active{filter:brightness(0.95);}
  /* ---------- 移动端触屏动作栏 ---------- */
  #touchBar{position:absolute;right:14px;bottom:24px;display:none;gap:12px;pointer-events:auto;}
  .tbtn{width:58px;height:58px;border-radius:50%;background:rgba(12,16,30,0.6);border:1.5px solid rgba(214,178,96,0.55);color:#ffe9b0;font-size:14px;letter-spacing:1px;font-family:"Microsoft YaHei",sans-serif;backdrop-filter:blur(4px);touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer;}
  .tbtn:active{background:rgba(214,178,96,0.4);color:#fff;}
  @media (max-width:600px){
    #chatLog{width:calc(100vw - 110px);bottom:172px;max-height:120px;}
    #chatInputWrap{width:calc(100vw - 110px);bottom:132px;}
    #hintBar{bottom:88px;}
    .hbtn,#hintBar .htext{font-size:12.5px;padding:7px 14px;}
    .stat{font-size:11.5px;padding:5px 9px;}
    .stat b{font-size:13px;}
    #centerMsg{font-size:23px;letter-spacing:3px;white-space:normal;max-width:88vw;text-align:center;line-height:1.45;}
  }
  #centerMsg{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-family:"KaiTi",serif;
    font-size:32px;color:#ffd977;letter-spacing:8px;text-shadow:0 0 24px rgba(255,200,80,0.6);
    opacity:0;transition:opacity .8s;white-space:nowrap;}
  #flash{position:fixed;inset:0;background:#ffe9b0;opacity:0;pointer-events:none;transition:opacity 1.4s;z-index:60;}
</style>
</head>
<body>
<div id="enterScreen">
  <div class="enter-card">
    <div class="seal">云上<br>禅寺</div>
    <div class="enter-title">云上禅寺</div>
    <div class="enter-sub">暮鼓晨钟 · 静心一炷香</div>
    <input id="nameInput" maxlength="12" placeholder="输入你的 ID（法号）" autocomplete="off">
    <button id="enterBtn">入 寺</button>
    <div id="enterTip"></div>
    <div class="enter-foot">WebGL 3D · 实时多人 · 最多 100 人同寺<br>
      <span id="enterFootTip"><b>点击地面移动</b> · 鼠标拖拽转视角 · E 打坐 · J 念经 · K 敲木鱼</span></div>
  </div>
</div>
<div id="hud">
  <div id="topLeft">
    <div class="stat">在线香客<b id="onlineCount">1</b>人</div>
    <div class="stat">我的功德<b id="meritCount">0</b></div>
  </div>
  <div id="topRight"><button id="muteBtn">音效: 开</button></div>
  <div id="hintBar"></div>
  <div id="chatLog"></div>
  <div id="chatInputWrap"><input id="chatInput" maxlength="60" placeholder="按 Enter 发送… (Esc 取消)"><button id="chatSend">发送</button></div>
  <div id="touchBar">
    <button class="tbtn" id="btnChant">念经</button>
    <button class="tbtn" id="btnChat">聊天</button>
    <button class="tbtn" id="btnInteract">交互</button>
  </div>
  <div id="centerMsg"></div>
</div>
<div id="flash"></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script>
'use strict';
/* =====================================================================
 *  云上禅寺 · 3D 多人在线
 *  模块：工具 / 音频合成 / 纹理工厂 / 场景搭建 / 粒子 / 角色系统
 *        网络同步 / 本地控制与交互 / 聊天 / 主循环
 * ===================================================================== */

/* ---------------- 工具 ---------------- */
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp = (a,b,k)=>a+(b-a)*k;
function lerpAngle(a,b,k){ let d=(b-a)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return a+d*k; }
const dist2D = (ax,az,bx,bz)=>Math.hypot(ax-bx,az-bz);

/* ---------------- 音频（全合成，无音频文件） ---------------- */
const AudioSys = {
  ctx:null, master:null, muted:false, noiseBuf:null, chantNodes:null,
  ensure(){
    if(!this.ctx){
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value=0.8;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate*2;
      this.noiseBuf = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      // 环境风声
      const src=this.ctx.createBufferSource(); src.buffer=this.noiseBuf; src.loop=true;
      const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=360;
      const g=this.ctx.createGain(); g.gain.value=0.028;
      src.connect(f); f.connect(g); g.connect(this.master); src.start();
    }
    if(this.ctx.state==='suspended') this.ctx.resume();
  },
  toggleMute(){ this.muted=!this.muted; if(this.master) this.master.gain.value=this.muted?0:0.8; return this.muted; },
  /* 木鱼"笃" */
  knock(dist){
    if(!this.ctx) return;
    const vol = clamp(1-dist/24, 0.06, 1)*0.9;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(640,t); o.frequency.exponentialRampToValueAtTime(300,t+0.07);
    const g=this.ctx.createGain(); g.gain.setValueAtTime(0.5*vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.11);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.12);
    const n=this.ctx.createBufferSource(); n.buffer=this.noiseBuf;
    const bf=this.ctx.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=1900; bf.Q.value=1.5;
    const ng=this.ctx.createGain(); ng.gain.setValueAtTime(0.16*vol,t);
    ng.gain.exponentialRampToValueAtTime(0.001,t+0.04);
    n.connect(bf); bf.connect(ng); ng.connect(this.master); n.start(t); n.stop(t+0.05);
  },
  /* 寺钟 */
  bell(vol){
    if(!this.ctx) return; vol = vol||0.5;
    const t=this.ctx.currentTime;
    const parts=[[132,1],[198,0.5],[264,0.28],[352,0.15],[524,0.07]];
    for(const [f,a] of parts){
      const o=this.ctx.createOscillator(); o.type='sine';
      o.frequency.value=f*(1+(Math.random()*0.003-0.0015));
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(a*vol,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t+4.5);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+4.6);
    }
  },
  /* 诵经低鸣（仅本地自己念经时播放） */
  chant(on){
    if(!this.ctx) return;
    if(on && !this.chantNodes){
      const t=this.ctx.currentTime;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.07,t+1.4);
      const lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=430;
      g.connect(lp); lp.connect(this.master);
      const oscs=[110,110.8,165].map((f,i)=>{
        const o=this.ctx.createOscillator();
        o.type = i===2?'triangle':'sawtooth'; o.frequency.value=f;
        const og=this.ctx.createGain(); og.gain.value = i===2?0.22:0.5;
        o.connect(og); og.connect(g); o.start(); return o;
      });
      const lfo=this.ctx.createOscillator(); lfo.frequency.value=4.3;
      const lg=this.ctx.createGain(); lg.gain.value=0.016;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      this.chantNodes={oscs,lfo,g};
    } else if(!on && this.chantNodes){
      const t=this.ctx.currentTime, n=this.chantNodes;
      n.g.gain.cancelScheduledValues(t);
      n.g.gain.setValueAtTime(Math.max(n.g.gain.value,0.0001),t);
      n.g.gain.exponentialRampToValueAtTime(0.0001,t+0.8);
      n.oscs.forEach(o=>o.stop(t+0.9)); n.lfo.stop(t+0.9);
      this.chantNodes=null;
    }
  }
};

/* ---------------- 渲染基础 ---------------- */
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints>0) ||
  /Android|iPhone|iPad|iPod|HarmonyOS|Mobile/i.test(navigator.userAgent) ||
  new URLSearchParams(location.search).has('touch'); /* 触屏设备（手机/平板）；?touch=1 便于桌面调试触屏布局 */
const LOWFX = new URLSearchParams(location.search).has('lowfx') || (IS_TOUCH && window.innerWidth<1100); // 低配降级：关阴影、减粒子；手机默认低画质保帧率
if(IS_TOUCH){ /* 手机端文案适配 */
  const _eft = document.getElementById('enterFootTip');
  if(_eft) _eft.innerHTML = '<b>点击地面移动</b> · 拖拽转视角 · 右下角触屏按钮操作';
  const _ci = document.getElementById('chatInput');
  if(_ci) _ci.placeholder = '输入聊天内容，点「发送」';
}
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(LOWFX?1:Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = !LOWFX;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x54476a, 42, 175);
const camera = new THREE.PerspectiveCamera(58, window.innerWidth/window.innerHeight, 0.1, 600);

/* 灯光：黄昏 */
scene.add(new THREE.HemisphereLight(0x7a8fd0, 0x8a5a3a, 0.5));
const sun = new THREE.DirectionalLight(0xffb877, 1.15);
sun.position.set(-48, 30, 26);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-50; sun.shadow.camera.right=50;
sun.shadow.camera.top=50; sun.shadow.camera.bottom=-50;
sun.shadow.camera.near=5; sun.shadow.camera.far=160;
  sun.shadow.bias=-0.0015;
scene.add(sun);
  const buddhaLight = new THREE.PointLight(0xffd9a0, 2.4, 28, 2);
  buddhaLight.position.set(0, 10.5, -30); scene.add(buddhaLight);
  const burnerLight = new THREE.PointLight(0xff9040, 0.6, 8, 2);
  burnerLight.position.set(0, 2.6, -10); scene.add(burnerLight);

/* ---------------- 纹理工厂 ---------------- */
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

function plazaTexture(){
  const c=makeCanvas(256,256), x=c.getContext('2d');
  x.fillStyle='#8f8c85'; x.fillRect(0,0,256,256);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){
    x.fillStyle=(i+j)%2?'#8a8780':'#94918a';
    x.fillRect(i*64,j*64,64,64);
  }
  for(let i=0;i<900;i++){
    x.fillStyle=`rgba(60,55,50,${Math.random()*0.08})`;
    x.fillRect(Math.random()*256,Math.random()*256,2,2);
  }
  x.strokeStyle='rgba(40,38,35,0.65)'; x.lineWidth=2;
  for(let i=0;i<=4;i++){
    x.beginPath(); x.moveTo(i*64,0); x.lineTo(i*64,256);
    x.moveTo(0,i*64); x.lineTo(256,i*64); x.stroke();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(20,20);
  return t;
}
function pathTexture(){
  const c=makeCanvas(128,128), x=c.getContext('2d');
  x.fillStyle='#b8b2a4'; x.fillRect(0,0,128,128);
  x.strokeStyle='rgba(90,85,78,0.5)'; x.lineWidth=3;
  x.strokeRect(6,6,116,116);
  for(let i=0;i<250;i++){
    x.fillStyle=`rgba(80,75,68,${Math.random()*0.06})`;
    x.fillRect(Math.random()*128,Math.random()*128,2,2);
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,16);
  return t;
}
function plaqueTexture(text){
  const c=makeCanvas(512,160), x=c.getContext('2d');
  x.fillStyle='#12224a'; x.fillRect(0,0,512,160);
  x.strokeStyle='#d9a441'; x.lineWidth=8; x.strokeRect(10,10,492,140);
  x.strokeStyle='#e8c860'; x.lineWidth=2; x.strokeRect(18,18,476,124);
  x.fillStyle='#e8c860'; x.font='bold 92px KaiTi, STKaiti, "SimSun", serif';
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText(text,256,84);
  return new THREE.CanvasTexture(c);
}
function coupletTexture(chars){
  const list=[...chars], n=list.length;
  const c=makeCanvas(96,n*88), x=c.getContext('2d');
  x.fillStyle='#9e2b25'; x.fillRect(0,0,96,n*88);
  x.strokeStyle='#d9a441'; x.lineWidth=3; x.strokeRect(5,5,86,n*88-10);
  x.fillStyle='#f0d060'; x.font='bold 60px KaiTi, STKaiti, serif';
  x.textAlign='center'; x.textBaseline='middle';
  list.forEach((ch,i)=>x.fillText(ch,48,i*88+44));
  return new THREE.CanvasTexture(c);
}
/* 小和尚脸谱（全体共用） */
function monkFaceTexture(){
  const c=makeCanvas(256,256), x=c.getContext('2d');
  x.clearRect(0,0,256,256);
  x.strokeStyle='#3a2a28'; x.lineWidth=13; x.lineCap='round';
  /* 眯眼笑 */
  x.beginPath(); x.arc(88,108,20,Math.PI*0.15,Math.PI*0.85); x.stroke();
  x.beginPath(); x.arc(168,108,20,Math.PI*0.15,Math.PI*0.85); x.stroke();
  /* 微笑嘴 */
  x.beginPath(); x.arc(128,152,15,Math.PI*0.2,Math.PI*0.8); x.stroke();
  /* 腮红 */
  x.fillStyle='rgba(235,120,110,0.55)';
  x.beginPath(); x.ellipse(52,142,23,14,0,0,Math.PI*2); x.fill();
  x.beginPath(); x.ellipse(204,142,23,14,0,0,Math.PI*2); x.fill();
  return new THREE.CanvasTexture(c);
}
/* 弥勒佛笑脸（全体共用） */
function maitreyaFaceTexture(){
  const c=makeCanvas(512,512), x=c.getContext('2d');
  x.clearRect(0,0,512,512);
  /* 眉毛弯弧 */
  x.strokeStyle='#5a3a18'; x.lineWidth=18; x.lineCap='round';
  x.beginPath(); x.arc(170,130,36,Math.PI*1.15,Math.PI*1.85); x.stroke();
  x.beginPath(); x.arc(342,130,36,Math.PI*1.15,Math.PI*1.85); x.stroke();
  /* 眯月眼 */
  x.lineWidth=22;
  x.beginPath(); x.arc(170,205,38,Math.PI*0.1,Math.PI*0.9); x.stroke();
  x.beginPath(); x.arc(342,205,38,Math.PI*0.1,Math.PI*0.9); x.stroke();
  /* 大张嘴笑 */
  x.fillStyle='#4a1a10'; x.beginPath();
  x.moveTo(150,300); x.quadraticCurveTo(256,330,362,300);
  x.quadraticCurveTo(345,408,256,408); x.quadraticCurveTo(167,408,150,300);
  x.closePath(); x.fill();
  /* 上排牙 */
  x.fillStyle='#f8f4e8'; x.fillRect(160,300,192,26);
  /* 舌头 */
  x.fillStyle='#c04430'; x.beginPath(); x.ellipse(256,388,54,18,0,0,Math.PI*2); x.fill();
  /* 腮红与酒窝 */
  x.fillStyle='rgba(230,120,90,0.35)';
  x.beginPath(); x.ellipse(105,265,30,18,0,0,Math.PI*2); x.fill();
  x.beginPath(); x.ellipse(407,265,30,18,0,0,Math.PI*2); x.fill();
  x.fillStyle='rgba(200,115,85,0.5)';
  x.beginPath(); x.arc(140,320,10,0,Math.PI*2); x.fill();

function addBurnerStick(b){
  const g = new THREE.Group();
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,1.0,6), mat(0xd8c8a8,{roughness:0.8}));
  rod.position.y=0.5;

    new THREE.MeshStandardMaterial({color:0xff5522, emissive:0xff3010, emissiveIntensity:2.2}));
  tip.position.y=1.0;
  g.add(rod,tip);
  const ang = Math.random()*Math.PI*2, rr = Math.random()*0.9*b.s;
  g.position.set(b.x+Math.cos(ang)*rr, 1.6*b.s, b.z+Math.sin(ang)*rr);
  g.rotation.set((Math.random()-0.5)*0.3, Math.random()*Math.PI, (Math.random()-0.5)*0.3);
  const MAX = Math.round(44*b.s);
  if(b.sticks.length>=MAX){ const old=b.sticks.shift(); old.removeFromParent(); }
  b.sticks.push(g);
  scene.add(g);
}
function buildBurner(x,z,s){
  const bronze = mat(0x6a5a45,{roughness:0.55, metalness:0.55});
  const bronzeD = mat(0x57492f,{roughness:0.55, metalness:0.55});
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1.5*s,1.15*s,1.35*s,20), bronze);
  body.position.y=1.05*s; body.castShadow=true;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1.5*s,0.12*s,10,28), bronzeD);
  rim.rotation.x=Math.PI/2; rim.position.y=1.72*s;
  for(let i=0;i<3;i++){
    const a = i/3*Math.PI*2 + 0.5;
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.12*s,0.15*s,0.9*s,8), bronzeD);
    leg.position.set(Math.cos(a)*0.85*s,0.42*s,Math.sin(a)*0.85*s);

  }
  for(const sd of [-1,1]){
    const ear = new THREE.Mesh(new THREE.TorusGeometry(0.32*s,0.07*s,8,18,Math.PI), bronzeD);
    ear.position.set(sd*1.45*s,1.75*s,0); ear.rotation.z=Math.PI/2;
    ear.castShadow=true; g.add(ear);
  }
  const base = new THREE.Mesh(new THREE.CylinderGeometry(1.35*s,1.6*s,0.25*s,20), bronzeD);
  base.position.y=0.12*s; base.castShadow=true;
  g.add(body,rim,base);

  scene.add(g);
  addCollider(x,z,2.05*s);
  const b = {x,z,s,sticks:[],timer:0,boost:0};

}
function burnerAt(x,z){
  let best=null, bd=1e9;
  for(const b of burners){ const d=dist2D(x,z,b.x,b.z); if(d<bd){bd=d;best=b;} }
  return best;
}
function nearestBurner(x,z){
  const b = burnerAt(x,z);
  return (b && dist2D(x,z,b.x,b.z)<3.6) ? b : null;
}

const smokePool = [];
(function initSmoke(){
  for(let i=0;i<(LOWFX?36:70);i++){
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map:smokeTex, color:0xd8dce8, transparent:true, opacity:0,
      depthWrite:false
    }));
    sp.visible=false; scene.add(sp);
    smokePool.push({sp, life:0, max:1, vx:0, vy:0, vz:0, sway:Math.random()*10});
  }
})();
function spawnSmoke(px,py,pz){
  const p = smokePool.find(s=>!s.sp.visible); if(!p) return;
  p.sp.visible=true;
  p.sp.position.set(px+(Math.random()-0.5)*0.5, py, pz+(Math.random()-0.5)*0.5);
  p.life=0; p.max=3.2+Math.random();
  p.vx=(Math.random()-0.5)*0.1; p.vy=0.65+Math.random()*0.3; p.vz=(Math.random()-0.5)*0.1;
  p.sp.scale.set(0.35,0.35,1);
}
function updateSmoke(dt,t){
  for(const b of burners){
    b.boost = Math.max(0, b.boost-dt);
    b.timer -= dt;
    const rate = b.s>=1 ? (b.boost>0?0.05:0.13) : 0.34;
    if(b.timer<=0){
      b.timer = rate;
      spawnSmoke(b.x+(Math.random()-0.5)*1.4*b.s, 2.6*b.s+0.3, b.z+(Math.random()-0.5)*1.4*b.s);
    }
  }
  for(const p of smokePool){
    if(!p.sp.visible) continue;
    p.life+=dt;
    const k=p.life/p.max;
    p.sp.position.x += (p.vx+Math.sin(t*1.6+p.sway)*0.12)*dt;
    p.sp.position.y += p.vy*dt;
    p.sp.position.z += p.vz*Math.cos(t*1.3+p.sway)*dt*3;
    const sc = 0.35+k*1.5;
    p.sp.scale.set(sc,sc,1);
    p.sp.material.opacity = 0.34*(1-k);
    if(k>=1) p.sp.visible=false;
  }
}

  /* 腿（髋部枢轴） */
  function makeLeg(side){
    const legG = new THREE.Group();
    legG.position.set(side*0.085,0.46,0);
    const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.068,0.06,0.36,10), robeDarkMat);
    thigh.position.y=-0.18; thigh.castShadow=true;
    const shoe = new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8), new THREE.MeshStandardMaterial({color:0x2a2a30, roughness:0.85}));
    shoe.scale.set(0.9,0.6,1.5); shoe.position.set(0,-0.418,0.05);
    legG.add(thigh,shoe);
    return legG;
  }
  const legL = makeLeg(-1), legR = makeLeg(1);
  /* 手持香 */
  const stick = new THREE.Group();
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.55,6), mat(0xd8c8a8,{roughness:0.8}));
  rod.position.y=0.16;
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8),
    new THREE.MeshStandardMaterial({color:0xff5522, emissive:0xff3810, emissiveIntensity:1.8}));
  tip.position.y=0.45;
  stick.add(rod,tip); stick.position.set(0.05,0.9,0.40); stick.rotation.x=0.28; stick.visible=false;
  /* 念经光环 */
  const haloMat = new THREE.MeshBasicMaterial({color:0xffd070, transparent:true, opacity:0.75,
    blending:THREE.AdditiveBlending, depthWrite:false});
  const halo = new THREE.Mesh(new THREE.TorusGeometry(0.5,0.04,8,36), haloMat);
  halo.rotation.x=Math.PI/2; halo.visible=false;
  g.add(torso,collar,headG,armL,armR,legL,legR,stick,halo);
  return {group:g, torso, collar, headG, head, armL, armR, legL, legR, stick, halo, haloMat,
    robeMat, robeDarkMat, pose:'stand', walkPhase:Math.random()*10};
}
function setAvatarColor(av, colorHex){
  av.robeMat.color.setHex(colorHex);
  av.robeDarkMat.color.setHex(new THREE.Color(colorHex).multiplyScalar(0.68).getHex());
}
function applyPose(av, name, dt, speed, t, sway){
  const tp = POSES[name]||POSES.stand;
  const k = Math.min(1, dt*9);
  const torso=av.torso;
  torso.position.y = lerp(torso.position.y, tp.torsoY, k);
  torso.rotation.x = lerp(torso.rotation.x, tp.torsoRX, k);
  const ty = torso.position.y;
  av.collar.position.set(0, ty+0.28, 0.02);

  av.headG.position.y = lerp(av.headG.position.y, tp.headY, k);
  av.headG.rotation.x = lerp(av.headG.rotation.x, tp.headRX, k);
  if(sway){ av.headG.rotation.z = Math.sin(t*1.6+av.walkPhase)*0.05; }
  else { av.headG.rotation.z = lerp(av.headG.rotation.z, 0, k); }
  av.armL.rotation.x = lerp(av.armL.rotation.x, tp.armLX, k);
  av.armR.rotation.x = lerp(av.armR.rotation.x, tp.armRX, k);
  av.armL.rotation.z = lerp(av.armL.rotation.z, tp.armLZ, k);
  av.armR.rotation.z = lerp(av.armR.rotation.z, tp.armRZ, k);
  av.legL.rotation.x = lerp(av.legL.rotation.x, tp.legLX, k);
  av.legR.rotation.x = lerp(av.legR.rotation.x, tp.legRX, k);
  av.legL.rotation.y = lerp(av.legL.rotation.y, tp.legLY, k);
  av.legR.rotation.y = lerp(av.legR.rotation.y, tp.legRY, k);
  av.legL.position.z = lerp(av.legL.position.z, tp.legLZp, k);
  av.legR.position.z = lerp(av.legR.position.z, tp.legRZp, k);
  av.halo.position.set(0, Math.max(0.22, ty-0.34), 0.08);
  /* 行走摆动（站姿） */
  if(name==='stand' && speed>0.5){
    av.walkPhase += dt*8.5*(speed/4.2);
    const s=Math.sin(av.walkPhase);
    av.legL.rotation.x = s*0.6;
    av.legR.rotation.x = -s*0.6;
    av.armL.rotation.x = -s*0.5;
    av.armR.rotation.x = s*0.5;
    torso.position.y = tp.torsoY + Math.abs(s)*0.03;
  }
}

const STATE_TEXT = {idle:'', sit:'打坐', chant:'念经', incense:'烧香', knock:'敲木鱼'};
const STATE_COLOR = {sit:'#9fe6a0', chant:'#ffd977', incense:'#ff9a6a', knock:'#ffb878'};
function makeLabel(){

  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false, fog:false}));
  sp.scale.set(2.6,0.65,1); sp.position.y=1.95;

}
function drawLabel(lbl, id, stateKey){

/* 聊天气泡 */
function makeBubble(){
  const canvas = makeCanvas(512,160);
  const tex = new THREE.CanvasTexture(canvas);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false, fog:false}));
  sp.scale.set(2.7,0.85,1); sp.position.y=2.75; sp.visible=false;
  return {canvas, tex, sp, until:0};
}
function drawBubble(bb, text){
  const x = bb.canvas.getContext('2d');
  x.clearRect(0,0,512,160);
  /* 换行：中文约 17 字/行，最多 3 行 */
  const lines=[]; let line='';
  for(const ch of text){
    if(line.length>=17){ lines.push(line); line=ch; }
    else line+=ch;
    if(lines.length===3) break;
  }
  if(lines.length<3 && line) lines.push(line);
  const h = lines.length*36+22;
  const y0=(160-h)/2;
  x.fillStyle='rgba(255,253,245,0.96)';
  x.strokeStyle='rgba(70,55,35,0.55)'; x.lineWidth=3;
  const rx=18, ry=y0+8, rw=476, rh=h-16, r=16;
  x.beginPath();
  x.moveTo(rx+r,ry);
  x.lineTo(rx+rw-r,ry); x.quadraticCurveTo(rx+rw,ry,rx+rw,ry+r);
  x.lineTo(rx+rw,ry+rh-r); x.quadraticCurveTo(rx+rw,ry+rh,rx+rw-r,ry+rh);
  x.lineTo(280,ry+rh); x.lineTo(256,ry+rh+14); x.lineTo(236,ry+rh);
  x.lineTo(rx+r,ry+rh); x.quadraticCurveTo(rx,ry+rh,rx,ry+rh-r);
  x.lineTo(rx,ry+r); x.quadraticCurveTo(rx,ry,rx+r,ry);
  x.fill(); x.stroke();
  x.fillStyle='#2a2230'; x.font='26px "Microsoft YaHei",sans-serif'; x.textAlign='center'; x.textBaseline='middle';
  lines.forEach((l,i)=>x.fillText(l,256,ry+20+i*36+6));
  bb.tex.needsUpdate=true;
}

function handleMessage(d){
  switch(d.t){
    case 'ok': {
      selfId = d.you.id; selfColor = d.you.color;
      try{ localStorage.setItem('yzs_last_name', selfId); }catch(e){} /* 浏览器本地缓存：记住本次法号 */
      setAvatarColor(local.av, selfColor);
      local.x = d.you.x; local.z = d.you.z; local.ry = d.you.ry;
      onlineN = d.users.length;
      document.getElementById('onlineCount').textContent = onlineN;
      for(const u of d.users) addRemote(u);
      joined = true;
      document.getElementById('enterScreen').style.display='none';
      document.getElementById('hud').style.display='block';
      if(IS_TOUCH) document.getElementById('touchBar').style.display='flex';
      AudioSys.bell(0.5);
      addChatLine(`欢迎施主「${selfId}」来到云上禅寺`, true);
      addChatLine(IS_TOUCH ? '点击地面移动 · 右下角：交互/念经/聊天' : '点击地面移动 · E 打坐 · J 念经 · K 敲木鱼 · Enter 聊天', true);
      showCenter('欢迎入寺');
      break;
    }
    case 'full': showEnterError('寺内已满 100 人，请稍后再来'); break;
    case 'err': showEnterError(d.m); break;
    case 'join': addRemote(d.u); setOnline(0); addChatLine(`施主「${d.u.id}」入寺`, true); break;
    case 'left': removeRemote(d.id); break;
    case 'pos': { const r=remotes.get(d.id); if(r){ r.tx=d.x; r.tz=d.z; r.tr=d.ry; } break; }
    case 'state': {
      const r=remotes.get(d.id); if(!r) break;
      r.state=d.s;
      drawLabel(r.label, r.id, d.s);
      break;
    }
    case 'action': {
      const r=remotes.get(d.id);
      if(d.a==='knock'){
        const fx = r?r.tx:local.x, fz = r?r.tz:local.z;
        playKnockFX(fx, fz, true);
        if(r) r.knockUntil = performance.now()+2600;
      } else if(d.a==='burn'){
        const b = burnerAt(d.bx||0, d.bz||-10);
        if(b){ addBurnerStick(b); b.boost=6; spawnRipple(b.x, 2.2*b.s+0.3, b.z); }
      }
      break;
    }
    case 'chat': {
      const r = remotes.get(d.id);
      if(r){
        drawBubble(r.bubble, `${d.m}`); r.bubble.sp.visible=true;
        r.bubble.until = performance.now()+4200;
      }
      addChatLine(`${d.id}: ${d.m}`);
      break;
    }
    case 'sys': {
      addChatLine(d.m, true);
      if(d.m.indexOf('功德圆满')>=0){
        AudioSys.bell(0.7);
        const f=document.getElementById('flash');
        f.style.opacity='0.5'; setTimeout(()=>f.style.opacity='0',900);
        showCenter('功德圆满');
      }
      break;
    }
  }
}

/* ---------------- 地形高度 ---------------- */
function groundY(x,z){
  /* 台基三层收分（世界坐标，殿整体南移 3m 后）：t1 顶0.5 / t2 顶1.0 / t3 顶1.2，防止侧向走进台阶穿模 */
  const ax = Math.abs(x);
  /* 大台阶：北接台面 z=-16（1.2m），5 级向南逐级降至 z=-12.7，与几何一一对应 */
  if(ax<4.5 && z>-16 && z<=-12.7){
    return 1.2-0.24*Math.min(4, Math.floor((z+16)/0.66));
  }
  if(ax<15.5 && z<=-16 && z>=-38) return 1.2;      // t3 台面（31.6×19.6 中心z-27）
  if(ax<16.3 && z<=-16.7 && z>=-37.3) return 1.0;  // t2 收分层（32.6×20.6）
  if(ax<17 && z<=-16 && z>=-38) return 0.5;         // t1 底座层（34×22）
  return 0;
}
/* 角色目标高度（打坐时贴合蒲团/地面） */
function targetGroupY(x,z,state){
  if(state==='sit'||state==='chant'){
    for(const cu of cushions){
      if(dist2D(x,z,cu.x,cu.z)<0.7) return cu.y-0.28;
    }
    return groundY(x,z)-0.28;
  }
  return groundY(x,z);
}

function collideMove(px,pz){
  for(const c of colliders){
    const dx=px-c.x, dz=pz-c.z, r=c.r+0.32;
    const d2=dx*dx+dz*dz;
    if(d2<r*r && d2>1e-6){
      const d=Math.sqrt(d2);
      px=c.x+dx/d*r; pz=c.z+dz/d*r;
    }
  }
  for(const r of remotes.values()){
    const dx=px-r.x, dz=pz-r.z, rr=0.62;
    const d2=dx*dx+dz*dz;
    if(d2<rr*rr && d2>1e-6){
      const d=Math.sqrt(d2);
      px=r.x+dx/d*rr; pz=r.z+dz/d*rr;
    }
  }
  return [clamp(px,-38.5,38.5), clamp(pz,-38.5,38.5)];
}

/* 席地/蒲团占用判断 */
function cushionOccupied(cu){
  for(const r of remotes.values()){
    if((r.state==='sit'||r.state==='chant') && dist2D(r.tx,r.tz,cu.x,cu.z)<0.7) return true;
  }
  return false;
}

/* 交互目标检测 */
function nearestInteract(){
  if(local.state==='sit') return {type:'sitting'};
  if(local.state==='chant') return {type:'chanting'};
  if(local.state==='incense') return {type:'incensing'};
  let best=null, bd=2.0;
  for(const cu of cushions){
    if(cushionOccupied(cu)) continue;
    const d=dist2D(local.x,local.z,cu.x,cu.z);
    if(d<bd){ bd=d; best={type:'cushion', cu}; }
  }
  if(best) return best;
  if(nearestBurner(local.x,local.z)) return {type:'burner'};
  for(const f of fishes){
    if(dist2D(local.x,local.z,f.tx,f.tz)<2.5) return {type:'fish', fish:f};
  }
  return {type:'ground'};
}

function doInteract(){
  const it = nearestInteract();
  switch(it.type){
    case 'sitting': case 'chanting': standUp(); break;
    case 'cushion': sitDown(it.cu); break;
    case 'burner': startIncense(); break;
    case 'fish': tryKnock(); break;
    case 'ground': sitDown(null); break;
  }
}
function sitDown(cushion){
  if(cushion){
    local.seat = cushion;
    local.x = cushion.x; local.z = cushion.z; local.ry = Math.PI;
    send({t:'pos', x:local.x, z:local.z, ry:local.ry});
  } else local.seat = null;
  local.state='sit';
  send({t:'state', s:'sit'});
  drawLabel(local.label, selfId, 'sit');
  showCenter(local.seat?'落座蒲团':'席地而坐');
}
function standUp(){
  local.state='idle'; local.seat=null;
  send({t:'state', s:'idle'});
  drawLabel(local.label, selfId, 'idle');
  AudioSys.chant(false);
}
function toggleChant(){
  if(local.state==='sit'){
    local.state='chant'; send({t:'state', s:'chant'});
    drawLabel(local.label, selfId, 'chant');
    AudioSys.chant(true);
    showCenter('南无阿弥陀佛');
  } else if(local.state==='chant'){
    local.state='sit'; send({t:'state', s:'sit'});
    drawLabel(local.label, selfId, 'sit');
    AudioSys.chant(false);
  } else if(local.state==='idle'){
    showCenter(IS_TOUCH ? '需先打坐（点「交互」坐上蒲团）' : '需先打坐 (按 E)');
  }
}
function startIncense(){
  local.targetBurner = nearestBurner(local.x,local.z) || burnerAt(local.x,local.z);
  local.state='incense';
  local.incenseUntil = performance.now()+3000;
  send({t:'state', s:'incense'});
  drawLabel(local.label, selfId, 'incense');
  local.av.stick.visible=true;
  showCenter('敬香 · 虔诚一拜');
}
function finishIncense(){
  local.state='idle';
  send({t:'state', s:'idle'});
  drawLabel(local.label, selfId, 'idle');
  local.av.stick.visible=false;
  local.merit += 10;
  document.getElementById('meritCount').textContent = local.merit;
  const b = local.targetBurner || burnerAt(local.x,local.z);
  send({t:'action', a:'burn', bx:b.x, bz:b.z});
  addBurnerStick(b); b.boost=6;
  spawnRipple(b.x, 2.2*b.s+0.3, b.z);
  showCenter('功德 +10');
}
function tryKnock(){
  const now = performance.now();
  if(now < local.knockCd) return;
  const it = nearestInteract();
  if(it.type!=='fish'){ if(local.state==='idle') showCenter('请走到木鱼旁'); return; }
  local.knockCd = now + 240;
  local.merit += 1;
  document.getElementById('meritCount').textContent = local.merit;
  send({t:'action', a:'knock'});
  playKnockFX(it.fish.tx, it.fish.tz, false);
  local.knockUntil = now + 2600;
}
/* 敲木鱼特效（本地与远程共用） */
function playKnockFX(fx,fz,byRemote){
  let nearest=null, nd=99;
  for(const f of fishes){
    const d = dist2D(fx,fz,f.tx,f.tz);
    if(d<nd){ nd=d; nearest=f; }
  }
  if(nearest){
    nearest.swing = 1;
    spawnRipple(nearest.tx, (nearest.baseY||0)+1.9, nearest.tz);
  }
  const d = Math.hypot(camera.position.x-fx, camera.position.z-fz);
  AudioSys.knock(d);
}

/* ---------------- 聊天 ---------------- */
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const chatWrap = document.getElementById('chatInputWrap');
function addChatLine(text, isSys){
  const div=document.createElement('div');
  div.className='chat-line'+(isSys?' sys':'');
  div.textContent=text;
  chatLog.appendChild(div);
  while(chatLog.children.length>26) chatLog.removeChild(chatLog.firstChild);
  chatLog.scrollTop=chatLog.scrollHeight;
}
function submitChat(){
  const m = chatInput.value.trim();
  chatInput.value=''; chatInput.blur(); chatWrap.style.display='none';
  if(!m) return;
  send({t:'chat', m});
  drawBubble(local.bubble, m);
  local.bubble.sp.visible=true;
  local.bubble.until = performance.now()+4200;
  addChatLine(`${selfId}: ${m}`);
}
function toggleMute(){
  const muted = AudioSys.toggleMute();
  document.getElementById('muteBtn').textContent = muted ? '音效: 关' : '音效: 开';
}
document.getElementById('muteBtn').addEventListener('click', toggleMute);

/* 中央提示 */
let centerTimer=null;
function showCenter(text){
  if(new URLSearchParams(location.search).get('quiet')) return; /* 调试：截图验证时关闭中央提示 */
  const el=document.getElementById('centerMsg');
  el.textContent=text; el.style.opacity='1';
  if(centerTimer) clearTimeout(centerTimer);
  centerTimer=setTimeout(()=>el.style.opacity='0', 1800);
}

/* ---------------- 入口 ---------------- */
const nameInput=document.getElementById('nameInput');
const enterBtn=document.getElementById('enterBtn');
const enterTip=document.getElementById('enterTip');
function showEnterError(m){
  enterTip.textContent=m;
  if(joined){
    const s=document.getElementById('enterScreen');
    s.style.display='flex';
    enterBtn.disabled=true; enterBtn.style.opacity=0.5;
  }
}
function doEnter(){
  const id = nameInput.value.trim();
  if(id.length<2){ enterTip.textContent='ID 至少 2 个字符'; return; }
  enterTip.textContent='';
  try{ AudioSys.ensure(); }catch(e){}
  connect(id);
}
enterBtn.addEventListener('click', doEnter);
nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doEnter(); });
/* 浏览器本地缓存：回填上次使用的法号（可修改；?id= 参数仍优先） */
try{
  const _lastName = localStorage.getItem('yzs_last_name');
  if(_lastName) nameInput.value = _lastName;
}catch(e){}
/* URL 参数自动入寺（便于分享链接直达与自动化测试） */
(function(){
  const qid=new URLSearchParams(location.search).get('id');
  if(qid){ nameInput.value=qid; doEnter(); }
})();
if('ontouchstart' in window && window.innerWidth<900){
  enterTip.textContent='建议使用电脑浏览器体验';
}

/* ---------------- 主循环 ---------------- */
let lastT = performance.now();
const camTargetV = new THREE.Vector3();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05,(now-lastT)/1000); lastT=now;
  const t = now/1000;

  /* --- 本地玩家 --- */
  if(joined){
    const f=(keys['KeyW']||keys['ArrowUp']?1:0)-(keys['KeyS']||keys['ArrowDown']?1:0);
    const s=(keys['KeyD']||keys['ArrowRight']?1:0)-(keys['KeyA']||keys['ArrowLeft']?1:0);
    const canMove = local.state==='idle';
    let moving=false;
    if((f||s)) local.moveTarget=null; /* 键盘输入优先，清除点击走位目标 */
    let mx=0, mz=0;
    if((f||s) && canMove){
      const fx=-Math.sin(camYaw), fz=-Math.cos(camYaw);
      const rx=-fz, rz=fx;
      mx=f*fx+s*rx; mz=f*fz+s*rz;
    } else if(local.moveTarget && canMove){
      const dx=local.moveTarget.x-local.x, dz=local.moveTarget.z-local.z;
      const dist=Math.hypot(dx,dz);
      if(dist<0.25){ local.moveTarget=null; }
      else { mx=dx/dist; mz=dz/dist; }
    }
    const len=Math.hypot(mx,mz);
    if(len>0.01){
      mx/=len; mz/=len;
      const speed=4.2;
      let nx=local.x+mx*speed*dt, nz=local.z+mz*speed*dt;
      [nx,nz]=collideMove(nx,nz);
      /* 点击走位被碰撞挡住（几乎没移动）时放弃目标，防止贴墙空走 */
      if(local.moveTarget && Math.hypot(nx-local.x,nz-local.z) < speed*dt*0.25) local.moveTarget=null;
      local.x=nx; local.z=nz;
      local.ry=Math.atan2(mx,mz);
      moving=true;
    }
    if((f||s||local.moveTarget) && !canMove){ standUp(); }
    /* 烧香计时 */
    if(local.state==='incense' && now>=local.incenseUntil) finishIncense();
    /* 位置同步（10Hz 节流） */
    if(Math.abs(local.x-local.lastSent.x)>0.01 || Math.abs(local.z-local.lastSent.z)>0.01 ||
       Math.abs(local.ry-local.lastSent.ry)>0.03){
      local.lastSent={x:local.x,z:local.z,ry:local.ry};
      send({t:'pos', x:local.x, z:local.z, ry:local.ry});
    }
    /* 姿态与位置渲染 */
    const av=local.av;
    const poseName = local.state==='idle' ? 'stand' : (local.state==='incense' ? 'incense' : 'sit');
    applyPose(av, poseName, dt, moving?4.2:0, t, local.state==='chant');
    const tgtY = targetGroupY(local.x, local.z, local.state);
    av.group.position.x = local.x; av.group.position.z = local.z;
    av.group.position.y = lerp(av.group.position.y, tgtY, Math.min(1,dt*9));
    av.group.rotation.y = local.ry;
    av.halo.visible = local.state==='chant';
    if(local.state==='chant') av.halo.rotation.z += dt*1.2;
    /* 自己念经字符 */
    if(local.state==='chant' && Math.random()<dt*3.2)
      spawnChar(local.x, groundY(local.x,local.z)+1.6, local.z);
    /* 名牌状态 */
    const lbState = now<local.knockUntil ? 'knock' : local.state;
    drawLabel(local.label, selfId, lbState);
    if(local.bubble.sp.visible && now>local.bubble.until) local.bubble.sp.visible=false;

    /* 交互提示（手机端文案适配触屏按钮） */
    const it=nearestInteract();
    const hintBar=document.getElementById('hintBar');
    /* 情境化操作按钮：随所处场景动态生成，点击即触发对应动作（替代原纯文字提示） */
    let acts=null, htxt='';
    if(it.type==='sitting'){ acts=[['念经', toggleChant], ['起身', standUp]]; }
    else if(it.type==='chanting'){ acts=[['停止念经', toggleChant], ['起身', standUp]]; }
    else if(it.type==='incensing'){ htxt='敬香中…'; }
    else if(it.type==='cushion'){ acts=[['上蒲团打坐', doInteract]]; }
    else if(it.type==='burner'){ acts=[['敬香 · 功德+10', doInteract]]; }
    else if(it.type==='fish'){ acts=[['敲木鱼 · 功德+1', tryKnock]]; }
    else { acts=[['原地打坐', doInteract]]; }
    const sig = htxt ? ('t:'+htxt) : ('a:'+acts.map(a=>a[0]).join('|'));
    if(hintBar.dataset.sig !== sig){
      hintBar.dataset.sig = sig;
      hintBar.innerHTML = '';
      if(htxt){ const d=document.createElement('div'); d.className='htext'; d.textContent=htxt; hintBar.appendChild(d); }
      else for(const [label, fn] of acts){
        const b=document.createElement('button'); b.type='button'; b.className='hbtn'; b.textContent=label;
        b.addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); if(joined) fn(); });
        hintBar.appendChild(b);
      }
      hintBar.style.display='flex';
    }
  }

  /* --- 远程玩家 --- */
  const k = Math.min(1, dt*11);
  for(const r of remotes.values()){
    const px=r.x, pz=r.z;
    r.x=lerp(r.x,r.tx,k); r.z=lerp(r.z,r.tz,k);
    r.ry=lerpAngle(r.ry,r.tr,k);
    r.speed = dt>0 ? dist2D(px,pz,r.x,r.z)/dt : 0;
    const av=r.av;
    const poseName = r.state==='idle' ? 'stand' : (r.state==='incense' ? 'incense' : 'sit');
    applyPose(av, poseName, dt, r.speed, t, r.state==='chant');
    const tgtY = targetGroupY(r.x, r.z, r.state);
    av.group.position.x = r.x; av.group.position.z = r.z;
    av.group.position.y = lerp(av.group.position.y, tgtY, Math.min(1,dt*9));
    av.group.rotation.y = r.ry;
    av.halo.visible = r.state==='chant';
    if(r.state==='chant') av.halo.rotation.z += dt*1.2;
    if(r.state==='chant' && dist2D(r.x,r.z,camera.position.x,camera.position.z)<22 && Math.random()<dt*3)
      spawnChar(r.x, groundY(r.x,r.z)+1.6, r.z);
    av.stick.visible = r.state==='incense';
    if(now<r.knockUntil){ drawLabel(r.label, r.id, 'knock'); }
    else if(r.label.lastState!==r.state){ r.label.lastState=r.state; drawLabel(r.label, r.id, r.state); }
    if(r.bubble.sp.visible && now>r.bubble.until) r.bubble.sp.visible=false;
  }

  /* --- 相机 --- */
  if(CAMD){
    camera.position.copy(CAMD.pos);
    camera.lookAt(CAMD.look);
  } else if(joined){
    camTargetV.set(local.x, groundY(local.x,local.z)+1.7, local.z);
    const cx = camTargetV.x + Math.sin(camYaw)*Math.cos(camPitch)*camDist;
    const cz = camTargetV.z + Math.cos(camYaw)*Math.cos(camPitch)*camDist;
    const cy = camTargetV.y + Math.sin(camPitch)*camDist + 0.6;
    camCur.x=lerp(camCur.x,cx,Math.min(1,dt*8));
    camCur.y=lerp(camCur.y,cy,Math.min(1,dt*8));
    camCur.z=lerp(camCur.z,cz,Math.min(1,dt*8));
    camera.position.copy(camCur);
    camera.lookAt(camTargetV);
  } else {
    const a=t*0.085;
    camera.position.set(Math.sin(a)*30, 11, -30+Math.cos(a)*30);
    camera.lookAt(0,4.5,-30);
  }

  /* --- 场景动效 --- */
  updateSmoke(dt,t);
  updateChars(dt);
  updateRipples(dt);
  updateDust(dt,t);
  /* 烛火闪烁 */
  for(let i=0;i<flames.length;i++){
    const f=flames[i];
    const s=1+Math.sin(t*7+i*2.4)*0.22+Math.random()*0.08;
    f.scale.set(0.8*s,1.5*s,0.8*s);
  }
  /* 灯笼摆动 */
  for(let i=0;i<lanterns.length;i++){
    lanterns[i].rotation.z=Math.sin(t*0.9+i*1.3)*0.055;
    lanterns[i].rotation.x=Math.cos(t*0.7+i)*0.04;
  }
  /* 佛光脉动 */
  if(buddhaHalo){
    const s=1+Math.sin(t*2.1)*0.03;
    buddhaHalo.scale.set(s,s,1);
    buddhaHalo.children[0].material.opacity=0.68+Math.sin(t*2.1)*0.16;
  }
  /* 木鱼槌回弹 */
  for(const f of fishes){
    if(f.swing>0){
      f.swing=Math.max(0,f.swing-dt*4);
      f.mallet.rotation.x=-Math.sin(f.swing*Math.PI)*0.85;
    }
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);

/* 保活心跳 */
setInterval(()=>{ if(joined) send({t:'ping'}); }, 25000);

window.addEventListener('resize', ()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
